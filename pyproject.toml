[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-budget"
version = "0.1.0"
description = "LLMLingua prompt compression and token budgeting middleware"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "PyYAML>=6.0", "tiktoken>=0.7", "pdfplumber>=0.11", "llmlingua>=0.2.2", "pandas>=2.2", "rouge-score>=0.1.2", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
